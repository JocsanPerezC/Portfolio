<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Guía de campo</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:#1e4d36;font-family:'Atkinson Hyperlegible',sans-serif;overflow:hidden;padding:28px}
.book{display:grid;grid-template-columns:1fr 14px 1fr;height:100%;}
.page{background:#f2f5f1;padding:48px 56px;position:relative}
.spine{background:#14231a}
.tab{position:absolute;right:-1px;top:40px;display:flex;flex-direction:column;gap:6px}
.tab span{background:#f08a24;color:#14231a;font-weight:700;padding:6px 12px;font-size:14px}
.k{font-size:14px;letter-spacing:.14em;color:#1e4d36;font-weight:700}
h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:132px;line-height:.88;color:#14231a;margin-top:28px}
.cls{margin-top:28px;font-size:22px;color:#14231a;border-top:2px solid #14231a;padding-top:14px;display:grid;grid-template-columns:160px 1fr;row-gap:8px}
.cls b{font-size:14px;letter-spacing:.12em;color:#1e4d36}
.btns{position:absolute;left:56px;bottom:48px;display:flex;gap:12px}
.btns a{padding:16px 24px;font-weight:700;font-size:18px;text-decoration:none}
.plate h2{font-family:'Bricolage Grotesque';font-size:28px;color:#14231a}
.specs{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:20px;height:620px;margin-top:20px}
.sp{position:relative;border:2px solid #14231a}
.sp i{position:absolute;left:-2px;top:-2px;background:#14231a;color:#f2f5f1;font-style:normal;font-weight:700;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px}
.sp.big{grid-row:1/3}
.legend{position:absolute;bottom:40px;left:56px;right:56px;font-size:15px;color:#14231a;display:flex;gap:28px}
</style></head><body>
<div class="book">
 <div class="page">
  <p class="k">LÁMINA 1 · DESARROLLADOR FULL-STACK</p>
  <h1>Jocsan<br>Perez Coto</h1>
  <div class="cls"><b>HÁBITAT</b><span>Cartago, Costa Rica</span><b>OFICIO</b><span>Interfaces, backends y productos completos</span><b>ESTADO</b><span>Disponible para oportunidades</span></div>
  <div class="btns"><a style="background:#14231a;color:#f2f5f1">Ver las láminas</a><a style="border:2px solid #14231a;color:#14231a">Descargar CV</a></div>
 </div>
 <div class="spine"></div>
 <div class="page plate">
  <div class="tab"><span>01</span><span style="background:#1d5fd1;color:#fff">02</span><span>03</span></div>
  <h2>Especímenes observados</h2>
  <div class="specs">
   <div class="sp big" style="background:#e6ecff"><i>1</i></div>
   <div class="sp" style="background:#2f8f5b"><i>2</i></div>
   <div class="sp" style="background:#1b2433"><i>3</i></div>
  </div>
  <div class="legend"><span><b>1</b> PIELS</span><span><b>2</b> EDH Tournaments</span><span><b>3</b> Web 3D Inclusiva</span></div>
 </div>
</div></body></html>
