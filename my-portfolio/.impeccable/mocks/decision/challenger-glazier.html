<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Pared de vidrio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:#111;font-family:Archivo,sans-serif;color:#111;overflow:hidden}
.wall{display:grid;grid-template-columns:260px 1fr 90px 520px;grid-template-rows:150px 1fr 120px 150px;gap:8px;padding:8px;height:900px}
.p{background:#e9ebe8;padding:28px;position:relative}
.cobalt{background:#1f3fbf;color:#fff}.amber{background:#d99a1e}.wine{background:#7a1f2b;color:#fff}
.brand{grid-column:1;grid-row:1;font-family:Oswald;font-size:26px;letter-spacing:.06em}
.nav{grid-column:1;grid-row:2/4;display:grid;grid-template-rows:repeat(6,1fr);gap:8px;padding:0;background:#111}
.nav div{background:#e9ebe8;font-family:Oswald;font-size:20px;letter-spacing:.08em;padding:0 24px;display:flex;align-items:center}
.nav div.on{background:#1f3fbf;color:#fff}
.name{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;justify-content:flex-end}
.name h1{font-family:Oswald;font-weight:600;font-size:150px;line-height:.9;text-transform:uppercase}
.role{grid-column:2;grid-row:3;font-size:24px;display:flex;align-items:center}
.strip1{grid-column:3;grid-row:1/3}.strip2{grid-column:3;grid-row:3}.strip3{grid-column:3;grid-row:4}
.feat{grid-column:4;grid-row:1/3;padding:0;display:grid;grid-template-rows:56px 1fr 70px}
.feat .k{padding:18px 24px;font-family:Oswald;letter-spacing:.1em}
.feat .img{background:#2f8f5b url() center/cover}
.feat .t{padding:18px 24px;display:flex;justify-content:space-between;font-family:Oswald;font-size:20px}
.cta{grid-column:2;grid-row:4;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0;background:#111}
.cta div{display:flex;align-items:center;padding:0 28px;font-family:Oswald;font-size:22px;letter-spacing:.08em}
.contact{grid-column:1;grid-row:4;font-family:Oswald;font-size:20px}
.stats{grid-column:4;grid-row:3/5;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0;background:#111}
.stats div{background:#e9ebe8;padding:24px;font-family:Oswald;font-size:56px}
.stats small{display:block;font-family:Archivo;font-size:14px;letter-spacing:.1em}
</style></head><body>
<div class="wall">
 <div class="p brand">JOCSAN<br>PEREZ COTO</div>
 <div class="nav"><div class="on">INICIO</div><div>PROYECTOS</div><div>TECNOLOGÍAS</div><div>GITHUB</div><div>CONTACTO</div><div>REDES</div></div>
 <div class="p name"><h1>Jocsan<br>Perez Coto</h1></div>
 <div class="p role">Desarrollador full-stack · Cartago, Costa Rica · disponible para oportunidades</div>
 <div class="cobalt strip1"></div><div class="amber strip2"></div><div class="wine strip3"></div>
 <div class="p feat"><div class="k">PROYECTO DESTACADO</div><div class="img"></div><div class="t"><span>EDH TOURNAMENTS</span><span>VER →</span></div></div>
 <div class="cta"><div class="cobalt">VER PROYECTOS →</div><div style="background:#e9ebe8">DESCARGAR CV</div></div>
 <div class="p wine contact">HABLEMOS →</div>
 <div class="stats"><div>2+<small>AÑOS</small></div><div>18<small>TECNOLOGÍAS</small></div><div>3<small>PROYECTOS</small></div></div>
</div></body></html>
